# Step 1 config: HTTP only. Used to serve the app and the ACME HTTP-01
# challenge before a certificate exists. This is also what ships as the
# checked-in conf.d/app.conf, so a fresh deploy comes up on plain HTTP.
# init-letsencrypt.sh later replaces conf.d/app.conf with ssl.conf
# (rendered from ssl.conf.template).
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS + a variable in proxy_pass forces nginx to
    # re-resolve `api` on every request (respecting the 10s TTL) instead of
    # caching the IP once at worker startup — otherwise a redeploy that
    # recreates the api container (new internal IP) leaves nginx pointing
    # at a dead IP until it's restarted, causing 502s.
    resolver 127.0.0.11 valid=10s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        set $upstream_api api:3333;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
